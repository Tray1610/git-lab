name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check files
        run: python3 -m py_compile app.py
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
